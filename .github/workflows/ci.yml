name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Test
        run: dotnet test WorkerKit.sln --nologo -warnaserror
      - name: Pack
        env:
          # Directory.Build.targets turns this into 0.1.1-dev.<run>. Release versions come from release.yml.
          WorkerKitBuildNumber: ${{ github.run_number }}
        run: |
          dotnet pack src/WorkerKit.Abstractions/WorkerKit.Abstractions.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/WorkerKit.Hosting/WorkerKit.Hosting.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/WorkerKit.Soap/WorkerKit.Soap.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/WorkerKit.Testing/WorkerKit.Testing.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/WorkerKit.Templates/WorkerKit.Templates.csproj -c Release -o artifacts/packages --nologo
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error
