name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test Contoso.Billing.sln --nologo -warnaserror
      - name: Publish
        run: dotnet publish src/Contoso.Billing.Host/Contoso.Billing.Host.csproj -c Release -o artifacts/publish --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: artifacts/publish/**
          if-no-files-found: error
